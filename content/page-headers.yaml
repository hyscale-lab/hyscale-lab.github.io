  eyebrow: Research
  title: Three pillars, built in the open
  description: HyScale Lab research across serverless, LLM and agentic, and multi-modal and embodied AI cloud systems.
  lead: >-
    HyScale develops cloud systems through three research pillars, and releases the systems we build as
    open-source research infrastructure.
  epigraph:
    text: >-
      There are three principal means of acquiring knowledge available to us: observation of nature,
      reflection, and experimentation. Observation collects facts; reflection combines them;
      experimentation verifies the result of that combination.
    by: Denis Diderot, On the Interpretation of Nature

