# Title bands at the top of inner pages, plus a few small pieces of shared text.
#   page_title   browser tab and link-preview title
#   description  used for search results and link previews
#   lead         the sentence under the title
#   epigraph     optional quote under the lead: { text, by }

publications:
  page_title: Publications
  eyebrow: Research output
