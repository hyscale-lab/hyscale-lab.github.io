name: Update Google Scholar Citations

on:
  schedule:
    - cron: '0 0 * * 1' # Monday
    - cron: '0 0 * * 3' # Wednesday
    - cron: '0 0 * * 5' # Friday
  workflow_dispatch:

# contents: push the updated citations.yml; actions: start a deploy afterwards.
permissions:
  contents: write
  actions: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # See docs/CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Save current citations.yml hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f content/citations.yml ]; then
            sha_before=$(sha256sum content/citations.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
            echo "📝 No existing citations.yml file found."
          fi

      # Google Scholar often blocks or throttles GitHub's runners, so a blocked or
      # timed-out fetch is a warning (the next scheduled run retries). The run only
      # fails for real errors (e.g. a broken install), or when blocking has kept
      # citations.yml from updating for more than MAX_AGE_DAYS.
      - name: Run citation update script
        id: run_citation_update
        shell: bash
        env:
          PYTHONUNBUFFERED: '1' # show the script's progress in the log, even if it is killed
          MAX_AGE_DAYS: '14'
        run: |
          set +e
          echo "🚀 Running citation update script..."
          timeout 180 python scripts/update_scholar_citations.py
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "✅ Citation update succeeded." | tee -a $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ $status -ne 75 ] && [ $status -ne 124 ]; then
            echo "❌ Citation update script failed with exit code $status." | tee -a $GITHUB_STEP_SUMMARY
            exit $status
          fi
          # 75 = Scholar refused the request, 124 = timed out after 180 s.
          last=$(python -c "import yaml; print(yaml.safe_load(open('content/citations.yml'))['metadata']['last_updated'])")
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          msg="Google Scholar did not respond (exit $status). citations.yml was last updated $last ($age days ago)."
          if [ $age -gt $MAX_AGE_DAYS ]; then
            echo "::error::$msg That is more than $MAX_AGE_DAYS days; Scholar may be blocking GitHub's runners for good. Run the script locally and commit content/citations.yml."
            echo "❌ $msg Over $MAX_AGE_DAYS days old." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "::warning::$msg Will retry on the next scheduled run."
          echo "⚠️ $msg Will retry on the next scheduled run." >> $GITHUB_STEP_SUMMARY

      - name: Save new citations.yml hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f content/citations.yml ]; then
            sha_after=$(sha256sum content/citations.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ content/citations.yml was updated."
            echo "✅ content/citations.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ content/citations.yml was not changed."
            echo "ℹ️ content/citations.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Commit and push if changed
        run: |
          git add content/citations.yml
          git diff --staged --quiet || (
            echo "📤 Committing and pushing changes..."
            git commit -m "Update Google Scholar citations"
            git push
            # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
            gh workflow run deploy.yml --ref "${{ github.ref_name }}"
          )
        env:
          GH_TOKEN: ${{ github.token }}
