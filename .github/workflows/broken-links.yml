name: Check for broken external links

# Weekly check of external links in content/ (papers, people, pages, posts).
# Opens no issues; check the run summary.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # LinkedIn and X block automated requests.
          args: >-
            --user-agent 'curl/7.54' --max-retries 3 --retry-wait-time 2
            --exclude 'linkedin\.com' --exclude 'x\.com' --exclude 'twitter\.com'
            --no-progress 'content/**/*.md' 'content/**/*.yaml' 'content/papers.bib'
