name: Check for broken external links

# Weekly check of external links in content/ (papers, people, pages, posts).
# Opens no issues; check the run summary.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Root-relative links in content/ are resolved against the built site.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Accepted codes and bot-hostile hosts are in lychee.toml.
          args: >-
            --config lychee.toml --root-dir "${{ github.workspace }}/dist" --no-progress
            'content/**/*.md' 'content/**/*.yaml' 'content/papers.bib'
