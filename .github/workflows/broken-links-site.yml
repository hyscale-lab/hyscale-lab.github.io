name: Check for broken links on site

# After each deploy, check every internal link and asset in the built site.

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --offline --root-dir "${{ github.workspace }}/dist" --verbose --no-progress 'dist/**/*.html'
