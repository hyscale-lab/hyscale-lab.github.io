      - bullet: "**Invited Lecturer, 2021–2022:** Cloud Computing Architecture at ETH Zurich; Extreme Computing and Operating Systems at the University of Edinburgh."
      - bullet: "**Teaching Assistant, 2015–2022:** Systems Programming and Computer Architecture at ETH Zurich; Introduction to Computer Systems and Extreme Computing at Edinburgh; Computer Architecture, Statistics, and Introduction to Multiprocessor Architecture at EPFL."

    Funding and Collaborations:
