    Professional Activities:
      - bullet: "**Technical Program Committees:** ISCA 2025–2026; EuroSys 2026; ASPLOS 2024 light; USENIX ATC 2024–2025 light; OSDI 2024; SoCC 2023–2024; FedEdge 2023; MICRO 2022."
