      - bullet: "**Singapore Ministry of Education Tier-2 Grant:** S$661k for Serverless Programming Model and Cloud Resource Virtualization Co-Design for High Performance and Efficiency."
      - bullet: "**Arm Fellowship:** Three-year University of Edinburgh fellowship supporting Virtual Memory Software-Hardware Co-Design for Cloud Computing."
      - bullet: "**Google Faculty Award (2019):** One-year award for Neural Address Translation, based on a proposal with Boris Grot and Artemiy Margaritov."
      - bullet: "**Oracle Labs Gift (2018):** One-year gift for the Disaggregated Processors project at EPFL, based on a proposal prepared with Alex Daglis and Babak Falsafi."

